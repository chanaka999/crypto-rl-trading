version: '3.8'

services:
  backend:
    build: ./backend
    container_name: crypto-rl-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data_cache
      - backend_models:/app/saved_models
      - backend_db:/app
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: crypto-rl-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_models:
  backend_db:
